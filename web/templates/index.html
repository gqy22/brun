<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - brun</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><a href="/">brun</a></div>
    <div class="nav-links"><a href="/" class="active">Dashboard</a></div>
  </nav>

  <main class="container dashboard-page" x-data="dashboard()" x-init="init()">
    <div class="dashboard-header">
      <div>
        <div class="dashboard-title">Runs</div>
        <div class="dashboard-subtitle">跟踪命令、日志、耗时和输出文件。</div>
      </div>
      <div class="dashboard-stats" x-show="stats.total !== null">
        <div class="dashboard-stat"><span x-text="stats.total"></span><label>总运行</label></div>
        <div class="dashboard-stat"><span x-text="stats.running"></span><label>运行中</label></div>
        <div class="dashboard-stat"><span x-text="stats.failed"></span><label>失败</label></div>
        <div class="dashboard-stat"><span x-text="stats.rate+'%'"></span><label>成功率</label></div>
      </div>
    </div>

    <!-- 主机资源 -->
    <template x-if="hostStats && hostStats.memory">
      <div class="host-bar">
        <div class="host-item">
          <div class="host-item-label">CPU</div>
          <div class="host-item-value">
            <strong x-text="hostStats.cpu.known ? hostStats.cpu.used_percent.toFixed(1)+'%' : '···'"></strong>
            <span class="host-item-sub" x-show="hostStats.cpu.cores" x-text="hostStats.cpu.cores+' cores'"></span>
          </div>
          <div class="host-progress"><div class="host-progress-bar" :style="'width:'+(hostStats.cpu.used_percent||0)+'%'"></div></div>
        </div>
        <div class="host-item">
          <div class="host-item-label">内存</div>
          <div class="host-item-value">
            <strong x-text="(hostStats.memory.used_percent||0).toFixed(1)+'%'"></strong>
            <span class="host-item-sub" x-text="fmtBytes(hostStats.memory.available)+' 可用 / '+fmtBytes(hostStats.memory.total)"></span>
          </div>
          <div class="host-progress"><div class="host-progress-bar" :style="'width:'+(hostStats.memory.used_percent||0)+'%'"></div></div>
        </div>
        <div class="host-item host-item-load">
          <div class="host-item-label">负载 (1/5/15min)</div>
          <div class="host-item-value">
            <strong x-text="(hostStats.load.load1||0).toFixed(2)"></strong>
            <span class="host-item-sub" x-text="(hostStats.load.load5||0).toFixed(2)+' / '+(hostStats.load.load15||0).toFixed(2)"></span>
          </div>
        </div>
        <template x-for="d in visibleDisks" :key="d.mountpoint">
          <div class="host-item">
            <div class="host-item-label" x-text="d.mountpoint"></div>
            <div class="host-item-value">
              <strong x-text="(d.used_percent||0).toFixed(1)+'%'"></strong>
              <span class="host-item-sub" x-text="fmtBytes(d.free)+' 剩余 / '+fmtBytes(d.total)"></span>
            </div>
            <div class="host-progress"><div class="host-progress-bar" :style="'width:'+(d.used_percent||0)+'%'"></div></div>
          </div>
        </template>
      </div>
    </template>

    <!-- 过滤栏 -->
    <div class="filter-bar">
      <input type="text" x-model="filters.search" @input.debounce.300ms="loadRuns()"
             placeholder="搜索命令、名称或项目..." class="filter-input filter-input-main">
      <select x-model="filters.project" @change="loadRuns()">
        <option value="">所有项目</option>
        <template x-for="p in projects"><option :value="p" x-text="p"></option></template>
      </select>
      <select x-model="filters.status" @change="loadRuns()">
        <option value="">所有状态</option>
        <option value="starting">启动中</option>
        <option value="running">运行中</option>
        <option value="success">成功</option>
        <option value="success_with_warnings">成功（带警告）</option>
        <option value="failed">失败</option>
        <option value="failed_with_warnings">失败（带警告）</option>
        <option value="cancelled">已取消</option>
        <option value="cancelled_with_warnings">已取消（带警告）</option>
        <option value="timed_out">已超时</option>
        <option value="timed_out_with_warnings">已超时（带警告）</option>
      </select>
      <select x-model="filters.tag" @change="loadRuns()">
        <option value="">所有标签</option>
        <template x-for="t in tags"><option :value="t" x-text="t"></option></template>
      </select>
      <input type="text" x-model="filters.host" @input.debounce.300ms="loadRuns()"
             list="host-suggestions" placeholder="hostname" class="filter-input filter-input-sm">
      <datalist id="host-suggestions">
        <template x-for="h in hosts"><option :value="h"></option></template>
      </datalist>
      <input type="text" x-model="filters.user" @input.debounce.300ms="loadRuns()"
             list="user-suggestions" placeholder="username" class="filter-input filter-input-sm">
      <datalist id="user-suggestions">
        <template x-for="u in users"><option :value="u"></option></template>
      </datalist>
      <button x-show="activeFilterCount > 0" @click="clearFilters()" class="btn btn-sm btn-subtle">清除筛选</button>
      <button @click="doRefresh()" class="btn btn-sm btn-outline"
              :class="{'btn-spinning': refreshing}">
        <svg class="btn-refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        刷新
      </button>
    </div>

    <!-- 桌面端：表格 -->
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Run</th><th>Status</th><th>Duration</th><th>Command</th><th>Started</th><th></th></tr></thead>
        <tbody>
          <!-- 加载中 / 空状态 -->
          <template x-if="loading">
            <tr><td colspan="6" class="text-center text-muted">加载中...</td></tr>
          </template>
          <template x-if="!loading && runs.length === 0">
            <tr><td colspan="6"><div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div><div class="empty-title" x-text="activeFilterCount > 0 ? '没有匹配的运行记录' : '暂无运行记录'"></div><div class="empty-desc" x-text="activeFilterCount > 0 ? '调整搜索或清除筛选后再试。' : '运行你的第一个任务，这里会显示执行结果。'"></div></div></td></tr>
          </template>
          <!-- 数据行 -->
          <template x-for="(r, i) in runs" :key="r.id">
            <tr :class="'row-clickable animate-in row-status-'+(r.display_status || r.status)" :style="'animation-delay:' + (i * 35) + 'ms'"
                @click="location.href='/run/'+r.id">
              <td>
                <div class="run-cell">
                  <div class="run-cell-title" x-text="r.name || r.id"></div>
                  <div class="run-cell-meta">
                    <code class="run-id" x-text="r.id"></code>
                    <span x-text="r.project || '-'"></span>
                  </div>
                </div>
              </td>
	              <td>
	                <div class="status-with-diag">
	                  <span :class="'badge badge-'+(r.display_status || r.status)" :title="r.display_status && r.display_status !== r.status ? 'status: ' + r.status : ''" x-text="r.display_status || r.status"></span>
	                  <template x-if="diagLabel(r)">
	                    <span class="diag-pill" :title="diagTitle(r)" x-text="diagLabel(r)"></span>
	                  </template>
	                </div>
	              </td>
              <td class="duration-cell" x-text="getDuration(r)"></td>
              <td>
                <div class="cmd-cell cmd-cell-strong" :title="r.command" x-text="truncate(r.command, 96)"></div>
              </td>
              <td>
                <div class="started-cell">
                  <span x-text="fmtTime(r.started_at)"></span>
                  <small x-text="timeAgo(r.started_at)"></small>
                </div>
              </td>
              <td @click.stop style="white-space:nowrap">
                <button class="btn btn-sm btn-delete-row" @click="deleteRun(r.id, $event)" title="删除此记录">删除</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- 移动端：卡片列表 -->
    <div class="run-card-list">
      <template x-for="r in runs" :key="r.id">
        <div :class="'run-card animate-in row-status-'+(r.display_status || r.status)" @click="location.href='/run/'+r.id">
          <div class="run-card-header">
            <div>
              <div class="run-card-title" x-text="r.name || truncate(r.command, 48)"></div>
              <span class="run-card-id" x-text="r.id"></span>
            </div>
	            <div class="status-with-diag">
	              <span :class="'badge badge-'+(r.display_status || r.status)" :title="r.display_status && r.display_status !== r.status ? 'status: ' + r.status : ''" x-text="r.display_status || r.status"></span>
	              <template x-if="diagLabel(r)">
	                <span class="diag-pill" :title="diagTitle(r)" x-text="diagLabel(r)"></span>
	              </template>
	            </div>
          </div>
          <div class="run-card-body">
            <template x-if="r.name">
              <div class="run-card-row"><span class="label">Name</span><span class="value" x-text="r.name"></span></div>
            </template>
            <div class="run-card-row"><span class="label">Project</span><span class="value" x-text="r.project || '-'"></span></div>
            <div class="run-card-row"><span class="label">Duration</span><span class="duration-cell" x-text="getDuration(r)"></span></div>
            <div class="run-card-cmd" :title="r.command" x-text="truncate(r.command, 96)"></div>
          </div>
          <div class="run-card-footer">
            <span class="run-card-time" x-text="fmtTime(r.started_at)"></span>
            <button class="btn btn-sm btn-delete-row" @click="deleteRun(r.id, $event)" title="删除">删除</button>
          </div>
        </div>
      </template>
    </div>
  </main>

  <footer class="footer" id="footer-stats">
    <template x-if="stats.total !== null">
      <div class="footer-stats">
        <div class="footer-stat"><div class="footer-stat-value" x-text="stats.total"></div><div class="footer-stat-label">总运行</div></div>
        <div class="footer-stat"><div class="footer-stat-value" x-text="stats.rate+'%'"></div><div class="footer-stat-label">成功率</div></div>
        <div class="footer-stat"><div class="footer-stat-value" x-text="stats.todayCount"></div><div class="footer-stat-label">今日运行</div></div>
      </div>
    </template>
    <template x-if="stats.total === null">
      <p>brun &mdash; bio-runner &copy; 2026</p>
    </template>
  </footer>

  <script src="/static/app.js"></script>
  <script src="/static/alpine.js" defer></script>
  <script>
    function dashboard() {
      return {
        loading: true,
        refreshing: false,
        filters: { project: '', status: '', tag: '', search: '', host: '', user: '' },
        projects: [],
        tags: [],
        hosts: [],
        users: [],
        runs: [],
        stats: { total: null, rate: 0, todayCount: 0, running: 0, failed: 0 },
        hostStats: {},
        _runningTimers: {},
        _autoRefreshTimer: null,
        _hostTimer: null,

        async init() {
          await this.loadFilters();
          await this.loadRuns();
          this.loadFooterStats();
          this.loadHostStats();
          this._hostTimer = setInterval(() => this.loadHostStats(), 10000);
        },

        get activeFilterCount() {
          return (this.filters.project ? 1 : 0) +
            (this.filters.status ? 1 : 0) +
            (this.filters.tag ? 1 : 0) +
            (this.filters.search ? 1 : 0) +
            (this.filters.host ? 1 : 0) +
            (this.filters.user ? 1 : 0);
        },

        async loadFilters() {
          try {
            const [pj, tg, hs, us] = await Promise.all([
              fetch('/api/projects').then(r => r.json()),
              fetch('/api/tags').then(r => r.json()),
              fetch('/api/hosts').then(r => r.json()),
              fetch('/api/users').then(r => r.json()),
            ]);
            this.projects = pj;
            this.tags = tg;
            this.hosts = hs;
            this.users = us;
          } catch (e) { console.error('loadFilters:', e); }
        },

        async loadRuns() {
          try {
            const p = new URLSearchParams();
            if (this.filters.project) p.set('project', this.filters.project);
            const status = this.filters.status;
            if (status && status.endsWith('_with_warnings')) {
              p.set('display_status', status);
            } else if (status) {
              p.set('status', status);
            }
            if (this.filters.tag) p.set('tag', this.filters.tag);
            if (this.filters.search) p.set('search', this.filters.search);
            if (this.filters.host) p.set('host', this.filters.host);
            if (this.filters.user) p.set('user', this.filters.user);
            const resp = await fetch('/api/runs?' + p.toString());
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            this.runs = await resp.json();
            this.manageRunningTimers();
          } catch (err) {
            console.error('loadRuns error:', err);
          } finally {
            this.loading = false;
          }
        },

        doRefresh() {
          this.refreshing = true;
          this.loadRuns().then(() => {
            setTimeout(() => { this.refreshing = false; }, 400);
          });
        },

        clearFilters() {
          this.filters = { project: '', status: '', tag: '', search: '', host: '', user: '' };
          this.loadRuns();
        },

        manageRunningTimers() {
          var seen = {};
          this.runs.forEach(function(r) {
            if ((r.status === 'running' || r.status === 'starting') && r.started_at) seen[r.id] = r.started_at;
          });
          var self = this;
          Object.keys(seen).forEach(function(id) {
            if (!self._runningTimers[id]) self._runningTimers[id] = seen[id];
          });
          Object.keys(self._runningTimers).forEach(function(id) {
            if (!seen[id]) delete self._runningTimers[id];
          });
          var hasRunning = Object.keys(self._runningTimers).length > 0;
          if (hasRunning && !self._autoRefreshTimer) {
            self._autoRefreshTimer = setInterval(() => self.loadRuns(), 10000);
          } else if (!hasRunning && self._autoRefreshTimer) {
            clearInterval(self._autoRefreshTimer);
            self._autoRefreshTimer = null;
          }
        },

	        getDuration(r) {
	          var started = this._runningTimers[r.id];
	          if (started && (r.status === 'running' || r.status === 'starting')) {
            var ms = Date.now() - new Date(started).getTime();
            return formatDuration(ms);
          }
	          return r.duration || '-';
	        },

	        diagLabel(r) {
	          var d = r.diagnostic_summary || {};
	          if ((d.error_count || 0) > 0) return 'E' + d.error_count;
	          if ((d.warning_count || 0) > 0) return 'W' + d.warning_count;
	          return '';
	        },

	        diagTitle(r) {
	          var d = r.diagnostic_summary || {};
	          if ((d.error_count || 0) > 0) return d.error_count + ' error diagnostics';
	          if ((d.warning_count || 0) > 0) return d.warning_count + ' warning diagnostics';
	          return '';
	        },

	        async loadFooterStats() {
          try {
            var runs = await fetch('/api/runs').then(r => r.json());
            if (!Array.isArray(runs)) return;
            var total = runs.length;
            var success = runs.filter(function(r) { return r.status === 'success'; }).length;
            var running = runs.filter(function(r) { return r.status === 'running' || r.status === 'starting'; }).length;
            var failed = runs.filter(function(r) { return r.status === 'failed'; }).length;
            var today = new Date().toISOString().slice(0, 10);
            this.stats = {
              total: total,
              rate: total > 0 ? Math.round(success / total * 100) : 0,
              running: running,
              failed: failed,
              todayCount: runs.filter(function(r) { return r.started_at && r.started_at.startsWith(today); }).length
            };
          } catch (e) { /* 静默 */ }
        },

        async loadHostStats() {
          try {
            const r = await fetch('/api/host');
            if (r.ok) this.hostStats = await r.json();
          } catch (e) { /* 静默 */ }
        },

        get visibleDisks() {
          var disks = (this.hostStats && this.hostStats.disks) || [];
          // 只展示大于 1GB 的数据盘，按容量降序取前 6 个，过滤掉 snap/容器等噪音挂载点
          return disks
            .filter(function(d) { return d.total > 1024 * 1024 * 1024; })
            .sort(function(a, b) { return b.total - a.total; })
            .slice(0, 6);
        },

        async deleteRun(id, e) {
          modalConfirm('确认删除', '将同时删除日志和输出文件，不可恢复。', async () => {
            var r = await fetch('/api/runs/' + id, { method: 'DELETE' });
            var d = await r.json();
            if (d.ok) { toast('success', '已删除'); this.loadRuns(); this.loadFooterStats(); }
            else toast('error', d.error || '删除失败');
          });
        }
      };
    }
    function fmtBytes(b) {
      if (!b || b < 1) return '0';
      var units = ['B', 'KB', 'MB', 'GB', 'TB'];
      var i = Math.floor(Math.log(b) / Math.log(1024));
      if (i >= units.length) i = units.length - 1;
      return (b / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }
  </script>
</body>
</html>
